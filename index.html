<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link  href="styles.css"   rel="stylesheet"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  
</head>
<body>
  <main>
    <div class="container">
      
      <img src="images/image-qr-code.png" alt="QR code linking to Frontend Mentor">
      
      <p class="main">Improve your front-end skills by building projects</p>
    <p class="sub">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>
  </main>
  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Lumine</a>.
  </footer>

</html>
